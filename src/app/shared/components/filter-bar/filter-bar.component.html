<div class="flex flex-wrap items-end gap-4 bg-white border border-gray-200 rounded-xl p-4 mb-5" [formGroup]="form">

  <!-- Fields -->
  <div class="flex flex-wrap items-end gap-4 flex-1">

    @if (showDateRange) {
      <div class="flex flex-col gap-1.5 min-w-[200px]">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Rentang Tanggal</label>
        <p-datepicker
          formControlName="dateRange"
          selectionMode="range"
          [readonlyInput]="true"
          dateFormat="dd/mm/yy"
          placeholder="Pilih rentang tanggal"
          [showButtonBar]="true"
        ></p-datepicker>
      </div>
    }

    @if (showWilayah && wilayahOptions.length > 0) {
      <div class="flex flex-col gap-1.5 min-w-[200px]">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Wilayah</label>
        <p-select
          formControlName="wilayahId"
          [options]="wilayahOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Semua Wilayah"
          [filter]="true"
          filterBy="label"
          [showClear]="true"
        ></p-select>
      </div>
    }

    @if (showKomoditi && komoditiOptions.length > 0) {
      <div class="flex flex-col gap-1.5 min-w-[200px]">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Komoditi</label>
        <p-select
          formControlName="komoditiId"
          [options]="komoditiOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Semua Komoditi"
          [filter]="true"
          filterBy="label"
          [showClear]="true"
        ></p-select>
      </div>
    }

    @if (showMode && modeOptions.length > 0) {
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Tampilan</label>
        <p-selectbutton
          formControlName="mode"
          [options]="modeOptions"
          optionLabel="label"
          optionValue="value"
        ></p-selectbutton>
      </div>
    }

  </div>

  <!-- Actions -->
  <div class="flex items-center gap-2">
    <button
      (click)="onFilter()"
      [disabled]="isLoading"
      class="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 disabled:opacity-60 text-white text-sm font-medium rounded-lg transition-colors"
    >
      <lucide-icon [img]="Search" [size]="14"></lucide-icon>
      <span>Tampilkan</span>
    </button>
    <button
      (click)="onReset()"
      [disabled]="isLoading"
      class="flex items-center gap-2 px-4 py-2 bg-white hover:bg-gray-50 disabled:opacity-60 text-gray-600 text-sm font-medium rounded-lg border border-gray-200 transition-colors"
    >
      <lucide-icon [img]="X" [size]="14"></lucide-icon>
      <span>Reset</span>
    </button>
  </div>

</div>
