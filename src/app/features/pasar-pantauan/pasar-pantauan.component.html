<div class="flex flex-col gap-5">

  <app-page-header
    title="Pasar Pantauan"
    subtitle="Daftar pasar yang dipantau harga komoditinya"
  ></app-page-header>

  <!-- Filter -->
  <div class="flex items-end gap-4 bg-white border border-gray-200 rounded-xl p-4" [formGroup]="filterForm">
    <div class="flex flex-col gap-1.5 min-w-[260px]">
      <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Wilayah</label>
      <p-select
        formControlName="wilayahId"
        [options]="wilayahOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Semua Wilayah"
        [filter]="true"
        filterBy="label"
        [showClear]="true"
        (onChange)="onFilter()"
      ></p-select>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <p-table
      [value]="data"
      [loading]="isLoading"
      styleClass="p-datatable-sm p-datatable-striped"
      [rowHover]="true"
      [globalFilterFields]="['nama_pasar','wilayah','alamat']"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nama Pasar</th>
          <th>Wilayah</th>
          <th>Alamat</th>
          <th class="text-center w-32">Lokasi</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="font-medium text-gray-800">{{ row.nama_pasar }}</td>
          <td class="text-gray-700">{{ row.wilayah }}</td>
          <td class="text-sm text-gray-400">{{ row.alamat ?? '-' }}</td>
          <td class="text-center">
            @if (row.maps_url) {
              <button
                (click)="openMaps(row.maps_url)"
                title="Buka di Google Maps"
                class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium text-green-700 bg-green-50 hover:bg-green-100 border border-green-200 rounded-lg transition-colors"
              >
                <lucide-icon [img]="MapPin" [size]="12"></lucide-icon>
                <span>Buka Peta</span>
                <lucide-icon [img]="ExternalLink" [size]="11"></lucide-icon>
              </button>
            } @else {
              <span class="text-gray-400 text-sm">-</span>
            }
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center py-12">
            <lucide-icon [img]="MapPin" [size]="32" class="text-gray-300 mx-auto block mb-2"></lucide-icon>
            <p class="text-sm text-gray-400">Tidak ada data pasar pantauan.</p>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="summary">
        <span class="text-xs text-gray-400">{{ data.length }} pasar terdaftar</span>
      </ng-template>

    </p-table>
  </div>

</div>
