<div class="flex flex-col gap-5">

  <app-page-header
    title="Grafik Perbandingan Harga"
    subtitle="Tren harga komoditi per wilayah — harian, mingguan, atau bulanan"
    [showExport]="series.length > 0"
    (export)="onExportPdf()"
  ></app-page-header>

  <!-- Filter -->
  <div class="flex flex-col gap-4 bg-white border border-gray-200 rounded-xl p-4" [formGroup]="filterForm">
    <div class="flex flex-wrap items-end gap-4">

      <div class="flex flex-col gap-1.5 min-w-[200px]">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Rentang Tanggal</label>
        <p-datepicker
          formControlName="dateRange"
          selectionMode="range"
          [readonlyInput]="true"
          dateFormat="dd/mm/yy"
          placeholder="Pilih rentang tanggal"
          [showButtonBar]="true"
        ></p-datepicker>
      </div>

      <div class="flex flex-col gap-1.5 min-w-[200px]">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">
          Komoditi <span class="text-red-400">*</span>
        </label>
        <p-select
          formControlName="komoditiId"
          [options]="komoditiOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Pilih Komoditi"
          [filter]="true"
          filterBy="label"
          [showClear]="true"
        ></p-select>
      </div>

      <div class="flex flex-col gap-1.5 flex-1 min-w-[260px]">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Wilayah (maks 5)</label>
        <p-multiselect
          formControlName="wilayahIds"
          [options]="wilayahOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Semua Wilayah"
          [filter]="true"
          filterBy="label"
          [maxSelectedLabels]="2"
          selectedItemsLabel="{0} wilayah dipilih"
        ></p-multiselect>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Granularitas</label>
        <p-selectbutton
          formControlName="mode"
          [options]="modeOptions"
          optionLabel="label"
          optionValue="value"
        ></p-selectbutton>
      </div>

    </div>

    <div class="flex items-center gap-3 flex-wrap">
      @if (errorMessage) {
        <div class="flex items-center gap-2 text-amber-700 text-sm">
          <i class="pi pi-exclamation-triangle text-amber-500"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }
      <button
        (click)="onFilter()"
        [disabled]="isLoading"
        class="flex items-center gap-2 px-5 py-2 bg-green-600 hover:bg-green-700 disabled:opacity-60 text-white text-sm font-medium rounded-lg transition-colors"
      >
        Tampilkan Grafik
      </button>
      <button
        (click)="onReset()"
        class="flex items-center gap-2 px-4 py-2 bg-white hover:bg-gray-50 text-gray-600 text-sm font-medium rounded-lg border border-gray-200 transition-colors"
      >
        Reset
      </button>
    </div>
  </div>

  <!-- Chart -->
  <div id="grafik-content" class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
    @if (isLoading) {
      <p-skeleton height="350px"></p-skeleton>
    } @else if (series.length > 0) {
      <app-apex-line-chart
        [series]="series"
        [height]="400"
        [title]="selectedKomoditiName"
        yAxisLabel="Harga (Rp/Kg)"
      ></app-apex-line-chart>
    } @else {
      <div class="flex flex-col items-center gap-3 py-16 text-gray-400">
        <lucide-icon [img]="TrendingUp" [size]="40" class="text-gray-300"></lucide-icon>
        <p class="text-sm text-gray-500 text-center">
          Pilih komoditi dan klik <strong class="text-gray-700">Tampilkan Grafik</strong> untuk melihat tren harga.
        </p>
      </div>
    }
  </div>

</div>
