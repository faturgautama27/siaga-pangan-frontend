<div class="dashboard">

  <div class="dashboard__header">
    <h1 class="dashboard__title">Dashboard</h1>
    <p class="dashboard__subtitle">Selamat datang di Sistem Informasi Siaga Pangan</p>
  </div>

  <div class="dashboard__cards">
    <p-card>
      <div class="kpi-card">
        <lucide-icon [img]="BarChart2" [size]="32" class="kpi-card__icon kpi-card__icon--green"></lucide-icon>
        <div class="kpi-card__body">
          <p class="kpi-card__label">Modul Aktif</p>
          <p class="kpi-card__value">8 Fitur Tersedia</p>
        </div>
      </div>
    </p-card>
    <p-card>
      <div class="kpi-card">
        <lucide-icon [img]="AlertTriangle" [size]="32" class="kpi-card__icon kpi-card__icon--yellow"></lucide-icon>
        <div class="kpi-card__body">
          <p class="kpi-card__label">Early Warning</p>
          <p class="kpi-card__value">Pantau EWS Harian</p>
        </div>
      </div>
    </p-card>
  </div>

</div>
