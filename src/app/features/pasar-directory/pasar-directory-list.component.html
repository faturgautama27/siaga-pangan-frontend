<div class="flex flex-col gap-5">

  <app-page-header
    title="Pasar Pantauan"
    subtitle="Direktori pasar yang dipantau untuk pelaporan harga komoditas"
  ></app-page-header>

  <!-- Table -->
  <div class="bg-white rounded-xl border border-slate-200 shadow-[0_1px_2px_rgba(15,23,42,0.04)] overflow-hidden">
    @if (isLoading()) {
      <div class="p-5 space-y-3">
        @for (i of [1,2,3,4,5,6,7,8]; track i) {
          <p-skeleton height="52px" borderRadius="10px"></p-skeleton>
        }
      </div>
    } @else {
      <p-table
        [value]="data()"
        [rowHover]="true"
        styleClass="p-datatable-sm"
        [paginator]="true"
        [rows]="15"
        [globalFilterFields]="['kabupaten_kota','nama_pasar']"
      >
        <ng-template pTemplate="header">
          <tr>
            <th class="!text-xs !font-semibold !uppercase !tracking-wider !text-slate-500 !bg-slate-50">Kabupaten/Kota</th>
            <th class="!text-xs !font-semibold !uppercase !tracking-wider !text-slate-500 !bg-slate-50">Nama Pasar</th>
            <th class="text-center !text-xs !font-semibold !uppercase !tracking-wider !text-slate-500 !bg-slate-50 w-40">Lokasi</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr>
            <td class="!font-semibold !text-slate-700">{{ row.kabupaten_kota }}</td>
            <td class="!text-slate-600">{{ row.nama_pasar }}</td>
            <td class="text-center">
              <button
                (click)="openMaps(row.link_gmaps)"
                title="Buka di Google Maps"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg transition-colors"
              >
                <lucide-icon [img]="MapPin" [size]="13"></lucide-icon>
                <span>Lihat Lokasi</span>
                <lucide-icon [img]="ExternalLink" [size]="11"></lucide-icon>
              </button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center !py-12">
              <lucide-icon [img]="MapPin" [size]="32" class="text-slate-300 mx-auto block mb-2"></lucide-icon>
              <p class="text-sm text-slate-400">Tidak ada data pasar pantauan.</p>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="summary">
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-400">{{ data().length }} pasar terdaftar</span>
          </div>
        </ng-template>

      </p-table>
    }
  </div>

</div>
