<div class="laporan-riwayat">

  <app-page-header
    title="Riwayat Laporan Koordinasi"
    subtitle="Histori laporan penanganan gejolak harga"
  ></app-page-header>

  <!-- Filter -->
  <div class="filter-bar" [formGroup]="filterForm">
    <div class="filter-fields">
      <div class="filter-field">
        <label class="filter-label">Rentang Tanggal</label>
        <p-datepicker
          formControlName="dateRange"
          selectionMode="range"
          [readonlyInput]="true"
          dateFormat="dd/mm/yy"
          placeholder="Filter tanggal laporan"
          [showButtonBar]="true"
        ></p-datepicker>
      </div>
      <div class="filter-field">
        <label class="filter-label">Wilayah</label>
        <p-select
          formControlName="wilayahId"
          [options]="wilayahOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Semua Wilayah"
          [filter]="true"
          [showClear]="true"
        ></p-select>
      </div>
      <div class="filter-field">
        <label class="filter-label">Komoditi</label>
        <p-select
          formControlName="komoditiId"
          [options]="komoditiOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Semua Komoditi"
          [filter]="true"
          [showClear]="true"
        ></p-select>
      </div>
      <div class="filter-actions">
        <button class="btn btn--primary" (click)="onFilter()" [disabled]="isLoading">Tampilkan</button>
        <button class="btn btn--secondary" (click)="onReset()">Reset</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <p-card>
    <p-table
      [value]="data"
      [loading]="isLoading"
      [paginator]="true"
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [lazy]="true"
      (onPage)="onPageChange($event)"
      styleClass="p-datatable-sm p-datatable-striped"
      [rowHover]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th class="w-28">Tanggal</th>
          <th>Wilayah</th>
          <th>Komoditi</th>
          <th>Isi Laporan</th>
          <th>PIC</th>
          <th>Koordinator</th>
          <th class="text-center w-28">Status</th>
          <th class="w-36">Waktu Input</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="text-sm">{{ row.tanggal | date:'dd/MM/yyyy' }}</td>
          <td class="font-medium">{{ row.wilayah }}</td>
          <td>{{ row.komoditi }}</td>
          <td class="text-sm laporan-text">{{ row.isi_laporan }}</td>
          <td class="text-sm">{{ row.pic }}</td>
          <td class="text-sm">{{ row.koordinator }}</td>
          <td class="text-center">
            <app-status-badge [status]="row.status" size="sm"></app-status-badge>
          </td>
          <td class="text-sm text-gray">{{ row.created_at | date:'dd/MM/yy HH:mm' }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8" class="empty-state">
            Belum ada laporan koordinasi.
          </td>
        </tr>
      </ng-template>

    </p-table>
  </p-card>

</div>
