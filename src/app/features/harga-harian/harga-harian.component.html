<div class="flex flex-col gap-5">

  <app-page-header
    title="Harga Harian"
    subtitle="Data harga komoditi pangan per wilayah"
    [showExport]="true"
    (export)="onExportPdf()"
  ></app-page-header>

  <app-filter-bar
    [form]="filterForm"
    [wilayahOptions]="wilayahOptions"
    [komoditiOptions]="komoditiOptions"
    [showDateRange]="true"
    [showWilayah]="true"
    [showKomoditi]="true"
    [isLoading]="isLoading"
    (filter)="onFilter()"
    (reset)="onReset()"
  ></app-filter-bar>

  <div id="harga-harian-table" class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <p-table
      [value]="data"
      [loading]="isLoading"
      [paginator]="true"
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [lazy]="true"
      (onPage)="onPageChange($event)"
      styleClass="p-datatable-sm p-datatable-striped"
      [rowHover]="true"
      dataKey="id"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="tanggal" class="w-32">
            Tanggal <p-sortIcon field="tanggal"></p-sortIcon>
          </th>
          <th pSortableColumn="wilayah">
            Wilayah <p-sortIcon field="wilayah"></p-sortIcon>
          </th>
          <th pSortableColumn="komoditi">
            Komoditi <p-sortIcon field="komoditi"></p-sortIcon>
          </th>
          <th class="w-32 text-right">Satuan</th>
          <th pSortableColumn="harga" class="w-36 text-right">
            Harga <p-sortIcon field="harga"></p-sortIcon>
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="text-sm text-gray-600">{{ row.tanggal | date:'dd/MM/yyyy' }}</td>
          <td class="font-medium text-gray-800">{{ row.wilayah }}</td>
          <td class="text-gray-700">{{ row.komoditi }}</td>
          <td class="text-right text-sm text-gray-400">{{ row.satuan }}</td>
          <td class="text-right font-semibold text-gray-900">{{ row.harga | rupiah }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center py-12 text-gray-400 text-sm">
            Tidak ada data. Gunakan filter di atas untuk menampilkan data.
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="summary">
        <div class="text-xs text-gray-400">
          Menampilkan {{ data.length }} dari {{ totalRecords }} baris
        </div>
      </ng-template>

    </p-table>
  </div>

</div>
