<div class="flex h-screen bg-gray-50 overflow-hidden font-['Inter']">

  <!-- Sidebar -->
  <aside
    class="flex flex-col bg-white border-r border-gray-100 shadow-sm transition-all duration-300 z-20 flex-shrink-0"
    [class.w-64]="sidebarOpen"
    [class.w-16]="!sidebarOpen"
  >
    <!-- Logo -->
    <div class="flex items-center gap-3 px-4 py-4 border-b border-gray-100 min-h-[64px]">
      <lucide-icon [img]="ShieldAlert" [size]="28" class="text-green-600 flex-shrink-0"></lucide-icon>
      @if (sidebarOpen) {
        <div class="flex flex-col min-w-0">
          <span class="font-bold text-gray-800 text-sm leading-tight tracking-wide">SIAGA</span>
          <span class="font-bold text-green-600 text-sm leading-tight tracking-wide">PANGAN</span>
        </div>
      }
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-2 overflow-y-auto">
      @for (item of navItems; track item.route) {
        @if (!item.roles || item.roles.includes(userRole)) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-green-50 text-green-700 font-semibold border-r-2 border-green-600"
            class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-500 hover:bg-gray-50 hover:text-gray-800 transition-colors duration-150 border-r-2 border-transparent no-underline"
            [title]="!sidebarOpen ? item.label : ''"
          >
            <lucide-icon [img]="item.icon" [size]="17" class="flex-shrink-0"></lucide-icon>
            @if (sidebarOpen) {
              <span class="truncate">{{ item.label }}</span>
            }
          </a>
        }
      }
    </nav>

    <!-- User Panel -->
    <div class="flex items-center gap-3 px-4 py-3 border-t border-gray-100">
      <p-avatar
        [label]="userInitial"
        styleClass="bg-green-100 text-green-700 flex-shrink-0"
        shape="circle"
        size="normal"
      ></p-avatar>
      @if (sidebarOpen) {
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-gray-700 truncate leading-tight">{{ userName }}</p>
          <p class="text-xs text-gray-400 capitalize mt-0.5">{{ userRole }}</p>
        </div>
        <button
          (click)="logout()"
          class="flex items-center justify-center w-7 h-7 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors flex-shrink-0"
          title="Keluar"
        >
          <lucide-icon [img]="LogOut" [size]="15"></lucide-icon>
        </button>
      }
    </div>

  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">

    <!-- Topbar -->
    <header class="flex items-center gap-3 px-5 h-14 bg-white border-b border-gray-100 shadow-sm flex-shrink-0">
      <button
        (click)="toggleSidebar()"
        class="flex items-center justify-center w-8 h-8 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors"
      >
        <lucide-icon [img]="sidebarOpen ? X : Menu" [size]="18"></lucide-icon>
      </button>
      <div class="flex-1"></div>
      <span class="text-xs text-gray-400 font-medium">{{ today }}</span>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>

<p-toast></p-toast>
